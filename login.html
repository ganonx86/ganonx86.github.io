<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111315" />
    <title>Sign in | Quest Score</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-body">
    <main class="login-shell">
      <section class="login-intro"><a class="brand" href="login.html" aria-label="Quest Score home"><span class="brand-mark">+</span><span>quest<span class="brand-accent">score</span></span></a><div class="login-message"><p class="eyebrow">YOUR QUESTS, EVERYWHERE</p><h1>Keep your momentum in reach.</h1><p>Sign in locally to carry your quests and achievements on this device.</p></div></section>
      <section class="login-panel" aria-labelledby="loginHeading"><div class="login-panel-inner"><p class="eyebrow">WELCOME BACK</p><h2 id="loginHeading">Sign in to Quest Score</h2><p class="login-subtitle">Use a local account stored in your browser.</p><form class="email-login" id="localLoginForm"><label for="emailInput">Email</label><div class="email-row"><input id="emailInput" name="email" type="email" autocomplete="email" placeholder="you@example.com" required /><button class="button button-primary" type="submit">Continue</button></div><label for="nameInput">Display name (optional)</label><input id="nameInput" name="displayName" type="text" maxlength="20" placeholder="Player name" autocomplete="nickname" /></form><p class="login-status" id="loginStatus" role="status" aria-live="polite"></p><small class="login-legal">Your account is stored locally in this browser.</small></div></section>
    </main>
    <script src="login.js"></script>
  </body>
</html>
